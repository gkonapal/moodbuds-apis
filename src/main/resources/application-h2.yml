server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  datasource:
    url: jdbc:h2:mem:moodbuds;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;TRACE_LEVEL_SYSTEM_OUT=0
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  flyway:
    locations: classpath:db/migration/mysql
    baseline-on-migrate: false
    out-of-order: false

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  web:
    cors:
      allowed-origins: "http://localhost:5175,http://localhost:5173,http://127.0.0.1:5175"
      allowed-methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
      allowed-headers: "*"
      allow-credentials: true
      max-age: 3600

  jackson:
    serialization:
      write-dates-as-timestamps: false

jwt:
  secret: ${JWT_SECRET:dev-secret-key-min-256-bits-long-for-testing}
  expiration: 86400000

razorpay:
  key-id: ${RAZORPAY_KEY_ID:test_key}
  key-secret: ${RAZORPAY_KEY_SECRET:test_secret}

logging:
  level:
    root: INFO
    com.moodbuds: DEBUG
    org.flywaydb: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
